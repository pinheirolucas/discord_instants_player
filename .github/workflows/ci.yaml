name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up repo
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Vet
        run: go vet ./...

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Set up repo
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions

      # windows-latest ships MinGW-w64 gcc at C:\mingw64\bin but doesn't put
      # it on PATH by default; CGO (layeh.com/gopus) needs it to build.
      - name: Add MinGW gcc to PATH
        run: echo "C:\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        run: go build -o bin\discord_instants_player.exe .
        env:
          CGO_ENABLED: "1"

  govulncheck:
    runs-on: ubuntu-latest

    steps:
      - name: Set up repo
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ffmpeg:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch ffmpeg release metadata
        id: ffmpeg-metadata
        run: echo "version=$(curl -s https://www.gyan.dev/ffmpeg/builds/release-version)" >> "$GITHUB_OUTPUT"

      - name: Restore ffmpeg cache
        uses: actions/cache@v6
        with:
          path: bin
          key: ${{ runner.os }}-ffmpeg-${{ steps.ffmpeg-metadata.outputs.version }}

      - name: Download latest ffmpeg build from release branch
        run: |
          if [ -d bin ]; then
            echo "No ffmpeg update available"
            exit 0
          fi

          echo "Updating ffmpeg..."
          mkdir bin
          curl -fso bin/ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
