openapi: 3.1.0
info:
  title: discord_instants_player API
  version: "1.0"
  description: |
    HTTP API for controlling the Discord bot's playback and for reading
    from myinstants.com. This is the backend for the companion Electron/React
    UI in `discord_instants_player_ui`.

    ## Every response is HTTP 200

    Every route in this API answers with HTTP 200, whether it succeeded or
    failed. Success and error are both wrapped in the same envelope
    (`Envelope` below); tell them apart by the presence of `data` (success)
    versus `label` (error) — never by the status code. Where a response
    description below says "intended status", that is the status the
    handler *would* send if it wrote one; it is documented for context only
    and is not observed on the wire.

    ## Error labels

    All error messages are in Portuguese, since the only client is the
    companion desktop UI. `label` is a stable machine-readable code; the UI
    matches on it rather than on `message` or the (unwritten) status.
servers:
  - url: http://localhost:9001
    description: Default local bind address (server.address / --server-address / SERVER_ADDRESS)
security: []


paths:
  /bot/play:
    post:
      operationId: botPlay
      summary: Play a clip through the bot
      description: |
        Resolves `url` to a cached/downloaded clip and starts playing it on
        the bot's current voice connection, stopping whatever is already
        playing first (a bot can only play one clip at a time). Blocks until
        playback ends naturally or is interrupted by `POST /bot/stop`, then
        returns which one happened.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotPlayRequest"
      responses:
        "200":
          description: >-
            Always this status. See `data.exitReason` for success or `label`
            for the reason it failed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BotPlaySuccessEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                playedToTheEnd:
                  summary: Playback finished on its own
                  value: { data: { exitReason: end } }
                stopped:
                  summary: Interrupted by POST /bot/stop or a newer /bot/play
                  value: { data: { exitReason: stop } }
                invalidBody:
                  summary: Body was not valid JSON (intended status 400)
                  value: { label: invalid_body, message: "Requisição inválida" }
                invalidUrl:
                  summary: url is missing/malformed (intended status 400)
                  value: { label: invalid_url, message: "A URL enviada é inválida" }
                instantNotFound:
                  summary: Clip could not be resolved (intended status 400)
                  value: { label: instant_not_found, message: "O instant enviado não foi encontrado" }
                unsupportedAudioFormat:
                  summary: Downloaded file did not sniff as mp3 (intended status 400)
                  value: { label: unsuported_audio_format, message: "O formato de áudio do instant enviado não é suportado" }
                unknownError:
                  summary: Anything else (intended status 500)
                  value: { label: unknown_error, message: "Erro desconhecido tente novamente mais tarde" }

  /bot/stop:
    post:
      operationId: botStop
      summary: Stop whatever the bot is currently playing
      description: |
        Signals the in-flight `POST /bot/play` (if any) to stop; that
        request then returns with `exitReason: "stop"`. Safe to call when
        nothing is playing.
      responses:
        "200":
          description: Empty body; no Content-Type is set.

  /play:
    get:
      operationId: getPlay
      summary: Fetch a clip as a base64 data URI
      description: |
        Downloads/caches the clip at `url` (same cache the bot uses) and
        returns it inline, without touching the bot or its voice
        connection. Meant for local preview in the UI.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: The myinstants.com clip URL to fetch.
      responses:
        "200":
          description: Always this status; see `data.exists` for success or `label` for the reason it failed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaySuccessEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                found:
                  summary: Clip resolved and inlined
                  value: { data: { exists: true, content: "data:audio/mp3;base64,//uQx..." } }
                notFound:
                  summary: Clip could not be resolved
                  value: { data: { exists: false } }
                emptyUrl:
                  summary: url was missing/blank (intended status 400)
                  value: { label: empty_url, message: "Nenhuma URL enviada" }
                unknownError:
                  summary: Anything else (intended status 500)
                  value: { label: unknown_error, message: "Erro desconhecido tente novamente mais tarde" }

  /instant/list:
    get:
      operationId: listInstants
      summary: List or search myinstants.com clips
      description: |
        Either browses a region's index (no `search`) or searches by name
        (`search`, which ignores `region`). `pages` is inferred from how
        many instants came back on this page, since myinstants.com's
        listing pages no longer carry a pager: a full page (36 instants)
        means there may be another, a short page means this is the last
        one, and an empty page means the caller paged past the end.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-indexed page number. Anything non-positive or non-numeric is treated as 1.
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search term. When set, region is ignored.
        - name: region
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z]{2}$"
            default: us
          description: Two-letter region code, case-insensitive. Ignored when search is set.
      responses:
        "200":
          description: >-
            Always this status. `bad_http_status` carries myinstants.com's
            own upstream status as its "intended status" — it is still
            written as 200 like every other case.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InstantListSuccessEnvelope"
                  - $ref: "#/components/schemas/EmptyListSuccessEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                results:
                  summary: One or more matches
                  value:
                    data:
                      instants:
                        - { name: "Bruh", url: "https://www.myinstants.com/media/sounds/bruh.mp3" }
                      pages: 2
                pastLastPage:
                  summary: A search paged past its end (upstream answered 404)
                  value: { data: [] }
                invalidRegion:
                  summary: region did not match ^[a-z]{2}$ (intended status 400)
                  value: { label: invalid_region, message: "A região enviada é inválida" }
                httpRequest:
                  summary: Could not reach myinstants.com (intended status 500)
                  value: { label: http_request, message: "Ocorreu um erro ao se comunicar com o site myinstants.com" }
                badHttpStatus:
                  summary: myinstants.com answered a non-200/404 status (intended status = upstream's)
                  value: { label: bad_http_status, message: "O site myinstants.com respondeu com um status de erro" }
                nameLinkNotMatched:
                  summary: Scrape found a different number of names and play links — markup likely changed (intended status 500)
                  value: { label: name_link_not_matched, message: "A quantidade de links e botões não conincide" }
                unknownError:
                  summary: Anything else (intended status 500)
                  value: { label: unknown_error, message: "Erro desconhecido" }

  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: This document
      responses:
        "200":
          description: The OpenAPI document, as YAML.

  /docs:
    get:
      operationId: getDocs
      summary: Human-readable rendering of this document
      responses:
        "200":
          description: An HTML page rendering /openapi.yaml.

components:
  schemas:
    Envelope:
      type: object
      description: The shape every response uses, success or error.
      properties:
        label:
          type: string
          description: Present on error responses; a stable machine-readable code.
        message:
          type: string
          description: Present on error responses; a human-readable message, in Portuguese.
        data:
          description: Present on success responses; shape depends on the route.

    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [label, message]

    BotPlayRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: The myinstants.com clip URL to play.

    BotPlaySuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [exitReason]
              properties:
                exitReason:
                  type: string
                  enum: [end, stop]
                  description: end = playback finished naturally; stop = interrupted.

    PlaySuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [exists]
              properties:
                exists:
                  type: boolean
                content:
                  type: string
                  description: Only present when exists is true. A base64 data URI, e.g. "data:audio/mp3;base64,...".

    InstantButton:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
          format: uri

    InstantListSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              properties:
                instants:
                  type: array
                  items:
                    $ref: "#/components/schemas/InstantButton"
                pages:
                  type: integer

    EmptyListSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 0
              description: Always empty; sent when a search pages past its last result.
